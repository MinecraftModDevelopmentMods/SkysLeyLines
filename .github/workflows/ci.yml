name: Sky's Ley Lines CI

on:
  push:
    branches: [master-1.21.1-neo, 'feature/**']
  pull_request:
    branches: [master-1.21.1-neo]

permissions:
  contents: read

concurrency:
  group: skysleylines-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

  build:
    name: Build, test, and audit
    needs: wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build and verify the ordinary mod and Eclipse project
        shell: bash
        run: |
          set -euo pipefail
          gradle_jdk_args=(
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew clean --no-daemon --stacktrace --max-workers=2 "${gradle_jdk_args[@]}"
          ./gradlew build javadoc verifyArtifacts eclipse verifyEclipseProductionClasspath \
            runtimeProbeJar worldgenProbeJar --no-daemon --stacktrace --max-workers=2 "${gradle_jdk_args[@]}"
      - name: Prepare the audited beta bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.121012$ ]]
          jar="SkysLeyLines-$version.jar"
          (cd build/libs && sha256sum --strict --check SHA256SUMS)
          bundle="$RUNNER_TEMP/release"
          mkdir "$bundle"
          cp "build/libs/$jar" "build/libs/SkysLeyLines-$version-sources.jar" \
            "build/libs/SkysLeyLines-$version-javadoc.jar" "$bundle/"
          cp CHANGELOG.md "$bundle/"
          (cd "$bundle" && sha256sum -- "$jar" "SkysLeyLines-$version-sources.jar" \
            "SkysLeyLines-$version-javadoc.jar" CHANGELOG.md > SHA256SUMS)
          printf 'path=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          {
            printf '### Audited Sky’s Ley Lines %s artifacts\n\n```text\n' "$version"
            cat "$bundle/SHA256SUMS"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysLeyLines-${{ github.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SkysLeyLines-diagnostics-${{ github.sha }}
          path: |
            build/test-results/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14
